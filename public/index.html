<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Onze wijk</title>
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Onze wijk">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css?v={{v}}">
<link rel="stylesheet" href="/css/style.css?v={{v}}">
</head>
<body>
<header class="bar">
  <img id="logo" class="logo" alt="" hidden>
  <h1 id="title">Onze wijk</h1>
  <span id="offline" class="badge" hidden>Offline – laatst bekende stand</span>
  <div class="legend"><span><i class="dot green"></i><span data-label="green">Groen</span></span><span><i class="dot red"></i><span data-label="red">Rood</span></span></div>
  <div class="bar-switches">
  <label class="switch" id="num-switch-wrap" title="Huisnummers op de kaart tonen">
    <input type="checkbox" id="num-switch" role="switch" aria-label="Huisnummers op de kaart tonen">
    <span class="track" aria-hidden="true"><span class="thumb"></span></span>
    <span class="switch-text">Huisnummers</span>
    <svg class="num-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="12" y="17.2" text-anchor="middle" font-size="9.5" font-weight="800" fill="currentColor" font-family="system-ui,sans-serif">12</text>
    </svg>
  </label>
  <!-- Alleen in de browser (niet in de geïnstalleerde app): schakelt "Huis wijzigen" in de menubalk in -->
  <label class="switch" id="edit-switch-wrap" hidden title="Bewerken: jouw huis wijzigen">
    <input type="checkbox" id="edit-switch" role="switch" aria-label="Bewerken: jouw huis wijzigen">
    <span class="track" aria-hidden="true"><span class="thumb"></span></span>
    <span class="switch-text">Bewerken</span>
    <span class="edit-icon" aria-hidden="true">✏️</span>
  </label>
  </div>
  <nav class="actions" aria-label="Acties">
    <button id="intro-btn" hidden aria-label="Uitleg"><span class="ico">ℹ</span><span class="lbl">Uitleg</span></button>
    <button id="house-edit" hidden aria-label="Huis wijzigen"><span class="ico">🏠</span><span class="lbl">Huis wijzigen</span></button>
    <button id="sync-btn" hidden aria-label="Synchroniseren: huizen bijwerken" title="Huizen bijwerken"><span class="ico">🔄</span><span class="lbl">Sync</span></button>
    <button id="streets-btn" aria-label="Straten tonen of verbergen" aria-haspopup="dialog" hidden><span class="ico">🛣️</span><span class="lbl">Straten</span></button>
    <button id="pdf-view" aria-label="PDF bekijken"><span class="ico">📄</span><span class="lbl">PDF bekijken</span></button>
    <button id="pdf-dl" class="primary" aria-label="PDF opslaan"><span class="ico">⬇</span><span class="lbl">PDF opslaan</span></button>
    <button id="more-btn" hidden aria-haspopup="menu" aria-expanded="false" aria-controls="more-pop" aria-label="Meer"><span class="ico">⋯</span><span class="lbl">Meer</span></button>
  </nav>
  <div id="more-pop" class="more-pop" role="menu" aria-label="Meer" hidden></div>
</header>
<div class="viewport" id="vp"></div>

<dialog id="intro-dialog">
  <div class="intro-head">
    <h3 id="intro-title"></h3>
    <button id="intro-x" class="icon-btn" type="button" aria-label="Sluiten">✕</button>
  </div>
  <div id="intro-info" class="intro-info" role="note" hidden>
    <span class="intro-info-ico" aria-hidden="true">🏠</span>
    <div><strong>Info</strong><p id="intro-info-text"></p></div>
  </div>
  <div id="intro-text" class="intro-text"></div>
  <p><button id="intro-close" class="primary">Sluiten</button></p>
</dialog>

<dialog id="install-dialog">
  <div class="intro-head">
    <h3>Installeer de app</h3>
    <button id="install-x" class="icon-btn" type="button" aria-label="Sluiten">✕</button>
  </div>
  <p id="install-text"></p>
  <p><button id="install-go" class="primary" hidden>Installeren</button> <button id="install-later" type="button">Niet nu</button></p>
</dialog>

<div id="house-sheet" class="house-sheet" hidden role="region" aria-label="Huis wijzigen"></div>

<dialog id="claim-dialog" aria-labelledby="claim-q">
  <h3 id="claim-q">Is dit jouw huis?</h3>
  <p><strong id="claim-title"></strong></p>
  <p class="muted">Je kunt met dit apparaat maar één huis kiezen. De beheerder keurt je wijziging eerst goed.</p>
  <div class="row"><button id="claim-yes" class="primary" type="button">Ja, dit is mijn huis</button><button id="claim-no" type="button">Annuleren</button></div>
</dialog>

<dialog id="streets-dialog" aria-labelledby="streets-title">
  <h3 id="streets-title">Straten</h3>
  <p class="muted">Kies welke straten op de kaart (en in de PDF) te zien zijn.</p>
  <div class="row"><button id="streets-all">Alles tonen</button><button id="streets-none">Alles verbergen</button></div>
  <p id="streets-total" class="streets-total"></p>
  <div id="streets-list" class="streets-list"></div>
  <p><button id="streets-close" class="primary">Sluiten</button></p>
</dialog>

<script src="/vendor/leaflet/leaflet.js?v={{v}}"></script>
<script src="/vendor/jspdf.js?v={{v}}"></script>
<script src="/js/wijk.js?v={{v}}"></script>
<script src="/js/pwa.js?v={{v}}"></script>
<script src="/js/resident.js?v={{v}}"></script>
<script src="/js/public.js?v={{v}}"></script>
</body>
</html>

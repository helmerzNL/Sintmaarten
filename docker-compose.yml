services:
  sintmaarten:
    image: ghcr.io/helmerznl/sintmaarten:latest
    container_name: sintmaarten
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "${PORT:-9888}"
    ports:
      - "${PORT:-9888}:${PORT:-9888}"
    volumes:
      - ./data:/data
